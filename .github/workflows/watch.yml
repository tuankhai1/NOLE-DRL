name: DRL Watcher

on:
  schedule:
    # Chay moi 5 phut (gia tri nho nhat GitHub cho phep). Co the bi tre vai phut.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # cho phep bam "Run workflow" thu cong

# Khong cho 2 lan chay chong len nhau (tranh day state bi dung do)
concurrency:
  group: drl-watch
  cancel-in-progress: false

permissions:
  contents: write   # de commit lai state.json

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Cai Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Chay bot (1 luot)
        env:
          DRL_SESSION_TOKEN: ${{ secrets.DRL_SESSION_TOKEN }}
          DRL_USERNAME: ${{ secrets.DRL_USERNAME }}
          DRL_TELEGRAM_BOT_TOKEN: ${{ secrets.DRL_TELEGRAM_BOT_TOKEN }}
          DRL_TELEGRAM_CHAT_ID: ${{ secrets.DRL_TELEGRAM_CHAT_ID }}
        run: python drl_watch.py once

      - name: Luu lai trang thai (chi khi co thay doi)
        if: always()
        run: |
          git config user.name "tuankhai1"
          git config user.email "194900143+tuankhai1@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "Khong co thay doi state."
          else
            git commit -m "update state [skip ci]"
            git push
          fi
