name: DRL Watcher

on:
  schedule:
    # Run every 5 minutes (the smallest interval GitHub allows). May be delayed a few minutes.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # allow manual "Run workflow"

# Never let two runs overlap (avoids racing on the state push)
concurrency:
  group: drl-watch
  cancel-in-progress: false

permissions:
  contents: write   # to commit state.json back

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the bot (once)
        env:
          DRL_SESSION_TOKEN: ${{ secrets.DRL_SESSION_TOKEN }}
          DRL_USERNAME: ${{ secrets.DRL_USERNAME }}
          DRL_TELEGRAM_BOT_TOKEN: ${{ secrets.DRL_TELEGRAM_BOT_TOKEN }}
          DRL_TELEGRAM_CHAT_ID: ${{ secrets.DRL_TELEGRAM_CHAT_ID }}
        run: python drl_watch.py once

      - name: Save state (only if it changed)
        if: always()
        run: |
          git config user.name "tuankhai1"
          git config user.email "194900143+tuankhai1@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No state change."
          else
            git commit -m "update state [skip ci]"
            git push
          fi
